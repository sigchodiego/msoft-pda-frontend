<div class="min-h-screen">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4">
      <div>
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Panel</p>
        <h1 class="text-lg font-semibold text-slate-900">Empleados</h1>
      </div>
      <button
        type="button"
        class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
        (click)="onLogout()"
      >
        Salir
      </button>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl items-start gap-6 px-4 py-8 lg:grid-cols-12">
    <section class="lg:col-span-4">
      <app-empleado-form
        [empleado]="empleadoService.selectedEmpleado"
        (save)="onSave($event)"
        (clear)="onClear()"
      ></app-empleado-form>
    </section>

    <section class="lg:col-span-8">
      <app-empleado-list
        [empleados]="(empleados$ | async) ?? []"
        (edit)="onEdit($event)"
        (remove)="onRemove($event)"
      ></app-empleado-list>
    </section>
  </main>
</div>
