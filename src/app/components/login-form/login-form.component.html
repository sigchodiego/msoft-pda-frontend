<div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Laboratorio</p>
  <h1 class="mt-1 text-2xl font-semibold text-slate-900">Acceso al sistema</h1>
  <p class="mt-2 text-sm text-slate-500">Ingresa con tu correo institucional.</p>

  <form class="mt-6 space-y-4" (ngSubmit)="onSubmit()">
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700" for="email">Correo</label>
      <input
        id="email"
        type="email"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200 disabled:cursor-not-allowed disabled:bg-slate-100"
        name="email"
        placeholder="correo@institucion.edu"
        [(ngModel)]="formModel.email"
        required
        [disabled]="isLoading"
      />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-200 disabled:cursor-not-allowed disabled:bg-slate-100"
        name="password"
        placeholder="Contraseña"
        [(ngModel)]="formModel.password"
        required
        [disabled]="isLoading"
      />
    </div>
    <div class="flex flex-col gap-3 pt-2 sm:flex-row">
      <button
        type="submit"
        class="flex-1 rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Validando...' : 'Iniciar sesión' }}
      </button>
      <button
        type="button"
        class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="isLoading"
        (click)="onRegister()"
      >
        Registrarse
      </button>
    </div>
  </form>
</div>
